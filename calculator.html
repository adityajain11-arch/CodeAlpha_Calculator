<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Modern Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom glassmorphism background glow effect */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-press:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <!-- Calculator Container -->
    <div class="glass-panel w-full max-w-sm rounded-3xl p-6 shadow-2xl shadow-black/50 text-white">
        
        <!-- Header / Title -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xs uppercase tracking-widest text-indigo-300 font-semibold">Calculator</h1>
            <div class="flex space-x-1.5">
                <div class="w-2.5 h-2.5 rounded-full bg-rose-500/80"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-amber-500/80"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-emerald-500/80"></div>
            </div>
        </div>

        <!-- Display Screen (Ensured pure dark transparent look with no white backgrounds or borders that show white strips) -->
        <div class="bg-slate-950/80 border border-slate-800/80 rounded-2xl p-4 mb-6 text-right overflow-hidden shadow-inner">
            <div id="previous-operand" class="text-slate-400 text-sm h-6 overflow-x-auto whitespace-nowrap tracking-wider font-light bg-transparent"></div>
            <div id="current-operand" class="text-3xl sm:text-4xl font-bold tracking-tight text-white overflow-x-auto whitespace-nowrap mt-1 bg-transparent">0</div>
        </div>

        <!-- Message Box for Errors (replaces alert) -->
        <div id="error-box" class="hidden mb-4 p-3 bg-rose-500/20 border border-rose-500/50 rounded-xl text-rose-300 text-xs text-center transition-all duration-300">
            <span id="error-message">Error</span>
        </div>

        <!-- Keypad Grid -->
        <div class="grid grid-cols-4 gap-3">
            <!-- Row 1: Clear, Delete, Divide -->
            <button onclick="clearDisplay()" class="btn-press bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 font-semibold py-4 rounded-2xl transition border border-rose-500/30 flex items-center justify-center text-sm">C</button>
            <button onclick="deleteNumber()" class="btn-press bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-4 rounded-2xl transition border border-slate-700/50 flex items-center justify-center text-sm">⌫</button>
            <button onclick="chooseOperation('%')" class="btn-press bg-indigo-900/40 hover:bg-indigo-800/40 text-indigo-300 font-semibold py-4 rounded-2xl transition border border-indigo-700/30 flex items-center justify-center text-lg">%</button>
            <button onclick="chooseOperation('÷')" class="btn-press bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-4 rounded-2xl transition shadow-lg shadow-indigo-600/30 flex items-center justify-center text-lg">÷</button>

            <!-- Row 2: 7, 8, 9, Multiply -->
            <button onclick="appendNumber('7')" class="btn-press bg-slate-800/80 hover:bg-slate-700 text-white font-medium py-4 rounded-2xl transition border border-slate-700/40 flex items-center justify-center text-lg">7</button>
            <button onclick="appendNumber('8')" class="btn-press bg-slate-800/80 hover:bg-slate-700 text-white font-medium py-4 rounded-2xl transition border border-slate-700/40 flex items-center justify-center text-lg">8</button>
            <button onclick="appendNumber('9')" class="btn-press bg-slate-800/80 hover:bg-slate-700 text-white font-medium py-4 rounded-2xl transition border border-slate-700/40 flex items-center justify-center text-lg">9</button>
            <button onclick="chooseOperation('×')" class="btn-press bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-4 rounded-2xl transition shadow-lg shadow-indigo-600/30 flex items-center justify-center text-lg">×</button>

            <!-- Row 3: 4, 5, 6, Subtract -->
            <button onclick="appendNumber('4')" class="btn-press bg-slate-800/80 hover:bg-slate-700 text-white font-medium py-4 rounded-2xl transition border border-slate-700/40 flex items-center justify-center text-lg">4</button>
            <button onclick="appendNumber('5')" class="btn-press bg-slate-800/80 hover:bg-slate-700 text-white font-medium py-4 rounded-2xl transition border border-slate-700/40 flex items-center justify-center text-lg">5</button>
            <button onclick="appendNumber('6')" class="btn-press bg-slate-800/80 hover:bg-slate-700 text-white font-medium py-4 rounded-2xl transition border border-slate-700/40 flex items-center justify-center text-lg">6</button>
            <button onclick="chooseOperation('−')" class="btn-press bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-4 rounded-2xl transition shadow-lg shadow-indigo-600/30 flex items-center justify-center text-lg">−</button>

            <!-- Row 4: 1, 2, 3, Add -->
            <button onclick="appendNumber('1')" class="btn-press bg-slate-800/80 hover:bg-slate-700 text-white font-medium py-4 rounded-2xl transition border border-slate-700/40 flex items-center justify-center text-lg">1</button>
            <button onclick="appendNumber('2')" class="btn-press bg-slate-800/80 hover:bg-slate-700 text-white font-medium py-4 rounded-2xl transition border border-slate-700/40 flex items-center justify-center text-lg">2</button>
            <button onclick="appendNumber('3')" class="btn-press bg-slate-800/80 hover:bg-slate-700 text-white font-medium py-4 rounded-2xl transition border border-slate-700/40 flex items-center justify-center text-lg">3</button>
            <button onclick="chooseOperation('+')" class="btn-press bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-4 rounded-2xl transition shadow-lg shadow-indigo-600/30 flex items-center justify-center text-lg">+</button>

            <!-- Row 5: 0, Dot, Equals -->
            <button onclick="appendNumber('0')" class="btn-press bg-slate-800/80 hover:bg-slate-700 text-white font-medium py-4 rounded-2xl transition border border-slate-700/40 col-span-2 flex items-center justify-center text-lg">0</button>
            <button onclick="appendNumber('.')" class="btn-press bg-slate-800/80 hover:bg-slate-700 text-white font-medium py-4 rounded-2xl transition border border-slate-700/40 flex items-center justify-center text-lg">.</button>
            <button onclick="compute()" class="btn-press bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-4 rounded-2xl transition shadow-lg shadow-emerald-600/30 flex items-center justify-center text-lg">=</button>
        </div>

    </div>

    <!-- JavaScript Calculation and Interaction Logic -->
    <script>
        // State variables for calculator logic
        let currentOperand = '0';
        let previousOperand = '';
        let operation = null;
        let resetScreenNext = false;

        const currentOperandTextElement = document.getElementById('current-operand');
        const previousOperandTextElement = document.getElementById('previous-operand');
        const errorBox = document.getElementById('error-box');
        const errorMessage = document.getElementById('error-message');

        // Show custom error message (safe alternative to alert())
        function showError(msg) {
            errorMessage.textContent = msg;
            errorBox.classList.remove('hidden');
            setTimeout(() => {
                errorBox.classList.add('hidden');
            }, 3000);
        }

        // Append number or decimal point
        function appendNumber(number) {
            if (number === '.' && currentOperand.includes('.')) return;
            
            if (currentOperand === '0' || resetScreenNext) {
                currentOperand = number;
                resetScreenNext = false;
            } else {
                currentOperand += number;
            }
            updateDisplay();
        }

        // Choose operator (+, -, ×, ÷, %)
        function chooseOperation(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                compute();
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '';
            updateDisplay();
        }

        // Perform arithmetic calculation
        function compute() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '−':
                case '-':
                    computation = prev - current;
                    break;
                case '×':
                case '*':
                    computation = prev * current;
                    break;
                case '÷':
                case '/':
                    if (current === 0) {
                        showError("Division by zero is not allowed!");
                        clearDisplay();
                        return;
                    }
                    computation = prev / current;
                    break;
                case '%':
                    computation = prev % current;
                    break;
                default:
                    return;
            }

            // Fix floating point precision artifacts (e.g., 0.1 + 0.2 = 0.30000000000000004)
            computation = Math.round(computation * 100000000) / 100000000;

            currentOperand = computation.toString();
            operation = null;
            previousOperand = '';
            resetScreenNext = true;
            updateDisplay();
        }

        // Clear screen and reset all state
        function clearDisplay() {
            currentOperand = '0';
            previousOperand = '';
            operation = null;
            updateDisplay();
        }

        // Delete last character (Backspace)
        function deleteNumber() {
            if (resetScreenNext) return;
            if (currentOperand.length === 1 || (currentOperand.length === 2 && currentOperand.startsWith('-'))) {
                currentOperand = '0';
            } else {
                currentOperand = currentOperand.slice(0, -1);
            }
            updateDisplay();
        }

        // Update UI screen contents
        function updateDisplay() {
            currentOperandTextElement.textContent = currentOperand;
            if (operation != null) {
                previousOperandTextElement.textContent = `${previousOperand} ${operation}`;
            } else {
                previousOperandTextElement.textContent = '';
            }
        }

        // Keyboard Support Integration
        window.addEventListener('keydown', e => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
                appendNumber(e.key);
            } else if (e.key === '+' || e.key === '-') {
                chooseOperation(e.key);
            } else if (e.key === '*') {
                chooseOperation('×');
            } else if (e.key === '/') {
                e.preventDefault(); // Prevent quick find shortcut in browsers
                chooseOperation('÷');
            } else if (e.key === 'Enter' || e.key === '=') {
                compute();
            } else if (e.key === 'Backspace') {
                deleteNumber();
            } else if (e.key === 'Escape') {
                clearDisplay();
            }
        });
    </script>
</body>
